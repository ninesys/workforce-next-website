[build]
  command = "npm run build"
  publish = ".next"

[build.processing.images]
  compress = true

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Canonicalize www and http to https+apex (consolidates duplicate discovery) ---
[[redirects]]
  from = "https://www.workforcenext.in/*"
  to = "https://workforcenext.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.workforcenext.in/*"
  to = "https://workforcenext.in/:splat"
  status = 301
  force = true

