<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#232338"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#146EF5"/>
      <stop offset="100%" style="stop-color:#5B9AFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="1050" cy="120" r="200" fill="#146EF5" opacity="0.08"/>
  <circle cx="150" cy="530" r="150" fill="#146EF5" opacity="0.05"/>

  <!-- Accent bar -->
  <rect x="80" y="180" width="60" height="4" rx="2" fill="url(#accent)"/>

  <!-- Company name -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#93BFFF" letter-spacing="2">WORKFORCE NEXT</text>

  <!-- Headline -->
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#F5F5F7">Your remote team.</text>
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#146EF5">Built to stay.</text>

  <!-- Subtext -->
  <text x="80" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#A9A9B8">Dedicated AI developers, data engineers, and product engineers from India.</text>
  <text x="80" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#A9A9B8">Context-matched by SethAI. 48-hour matching. Zero recruitment fees.</text>

  <!-- URL -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#55556A">workforcenext.in</text>
</svg>
